name = "AnalojiDenetcisi"
version = "0.4.0"
defaultTargets = ["Hakem", "Corpus", "Solution", "hakem"]

# Güvenilen: çekirdek ve modeller (anlam tabanı), iddia metinleri.
[[lean_lib]]
name = "Hakem"

[[lean_lib]]
name = "Challenge"

# Güvenilen: külliyat belgelerinin ağaçları (tools/corpus.py üretir).
[[lean_lib]]
name = "Corpus"

# Güvenilmeyen: ispatlar.
[[lean_lib]]
name = "Solution"

# Yargıcın öz-sınaması: kötü çözümler (varsayılan hedef değil).
[[lean_lib]]
name = "SelfTest"
roots = ["SelfTest.Axiom", "SelfTest.Sorry", "SelfTest.Statement", "SelfTest.Swap", "SelfTest.Native"]

# Komut satırı aracı: belge denetimi ve sertifika üretimi.
[[lean_exe]]
name = "hakem"
root = "tools.Cli"
