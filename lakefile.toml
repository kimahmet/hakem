name = "AnalojiDenetcisi"
version = "0.4.0"
defaultTargets = ["Hakem", "CorpusTrees", "Solution", "hakem"]

# Trusted: kernel and language (meaning base), claim statements.
[[lean_lib]]
name = "Hakem"

[[lean_lib]]
name = "Challenge"

# Trusted: trees of the corpus documents (generated by tools/corpus.py; named apart from `corpus/` to avoid a case collision on macOS).
[[lean_lib]]
name = "CorpusTrees"

# Untrusted: proofs.
[[lean_lib]]
name = "Solution"

# Judge self-test: bad solutions (not a default target).
[[lean_lib]]
name = "SelfTest"
roots = ["SelfTest.Axiom", "SelfTest.Sorry", "SelfTest.Statement", "SelfTest.Swap", "SelfTest.Native"]

# Command-line tool: document checking and certificate generation.
[[lean_exe]]
name = "hakem"
root = "tools.Cli"
