name: Hakem

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Same as the local pipeline: build, self-test, corpus, Lean kernel + nanoda → VERDICT.md
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build

      - name: Corpus documents (compiled checker)
        run: lake exe hakem check corpus/*.hkm

      - name: Judge self-test
        run: ./tools/selftest.sh

      - name: Verdict (Lean kernel + nanoda)
        run: ./tools/hakem.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VERDICT
          path: VERDICT.md

  # Full check against adversarial input: sandbox + all bundled kernels.
  comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build (for lake-manifest.json)
        run: lake build

      - name: lake comparator --paranoid
        run: lake comparator --paranoid
